[project]
name = "breezyvoice"
version = "0.2.0"
description = "BreezyVoice (Taiwanese Mandarin voice-cloning TTS) packaged for offline inference on CPU / Apple Silicon"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.9",
    "numpy>=2",
    "scipy>=1.16",
    "onnxruntime>=1.23",
    "tiktoken>=0.9",
    "einops>=0.8",
    "diffusers>=0.35",
    "g2pw==0.1.2",
    "transformers>=4.50",
    "inflect>=7.3",
    "soundfile>=0.13",
    "huggingface-hub>=0.30",
]

[project.scripts]
breezyvoice = "breezyvoice.cli:main"

[dependency-groups]
dev = ["pytest>=8"]
# Objective checks of the synthesized speech (`breezyvoice evaluate`); not needed to synthesize.
evaluation = ["sherpa-onnx>=2.0", "opencc-python-reimplemented>=0.1.7", "pypinyin>=0.55"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["breezyvoice", "cosyvoice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: loads the model and synthesizes audio (needs `breezyvoice setup` first)"]
